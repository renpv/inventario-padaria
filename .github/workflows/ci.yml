name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm run test

  # Testes de integração e e2e (tests/integration, tests/e2e) rodam contra o
  # projeto Supabase REAL — e é o MESMO projeto usado em produção, sem
  # staging separado (ver DEPLOY.md). Rodar isso automaticamente em todo
  # push/PR já se mostrou frágil na prática: cada teste dispara um sign-in
  # anônimo e a suíte inteira esbarra no rate limit do Supabase (ver AUTH.md)
  # — de propósito, não estão neste workflow. Rode localmente antes de
  # mergear mudanças que toquem auth, RLS, ou fluxos operacionais/gerenciais:
  #
  #   npm run test:integration
  #   npm run test:e2e
